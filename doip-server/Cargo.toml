[package]
name = "doip-server"
version = "0.1.0"
edition.workspace = true
publish = false
description = "DoIP server implementation for uds2sovd-proxy"
homepage.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# ---- async runtime ----
# net, rt-multi-thread, macros, time, sync, signal, io-util: TCP/UDP sockets,
# inactivity timeouts, session channels, graceful shutdown.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }
tokio-util = { workspace = true, features = ["codec"] }
futures-util = { workspace = true, features = ["sink", "async-await"] }
# ---- serialization ----
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true, features = ["parse", "serde"] }

# ---- tracing & logging ----
tracing = { workspace = true, features = ["std"] }

# ---- error handling ----
thiserror = { workspace = true, features = ["std"] }

# ---- data structures ----
bytes = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }

# ---- utility crates ----
hex = { workspace = true, features = ["std"] }
