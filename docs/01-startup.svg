0.6011">Services running concurrently</text><!--MD5=[7144c8bc9823ba0023d2d7d4d68fc732]
@startuml Startup
title 01-startup

<style>
sequenceDiagram {
    LineType ortho
    MessageAlign center
    ResponseMessageBelowArrow true
    ParticipantPadding 40
}
</style>

participant "DoIP Server App" as DoipServerApp
participant "Server" as Server
participant "TCP Service" as Tcp
participant "UDP Service" as Udp

== Load Configuration ==

DoipServerApp -> DoipServerApp: load configuration
|||
note right of DoipServerApp
  CLI config file or defaults
end note

== Initialize Services ==

DoipServerApp -> Tcp: create TCP service
|||
DoipServerApp -> Udp: create UDP service
|||
DoipServerApp -> Server: create server

== Start Runtime ==

DoipServerApp -> Server: start()
|||

Server -> Tcp: bind TCP listener
alt TCP bind failure
  Tcp - -> Server: startup error
  Server - -> DoipServerApp: startup failed
end
|||

Server -> Udp: bind UDP socket
alt UDP bind failure
  Udp - -> Server: startup error
  Server - -> DoipServerApp: startup failed
end

== Running State ==

Server -> Tcp: start connection loop
Server -> Udp: start discovery loop
|||

note over Tcp, Udp
  Services running concurrently
end note

@enduml

