[package]
name        = "uds2sovd"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
description = "DoIP server (ISO 13400-2) that proxies UDS diagnostics to a SOVD backend"

[[bin]]
name = "doip-server"
path = "app/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
uuid               = { version = "1", features = ["v4"] }
tracing            = "0.1"
tracing-subscriber = "0.3"
thiserror          = "2"
